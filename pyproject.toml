[project]
name = "air-nomad-society"
description = "Personalized flight deals delivered to your inbox."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{name = "Timon Rieger", email = "contact@timonrieger.de"}]
version = "0.1.0"

dependencies = [
    "bootstrap-flask>=2.2.0,<3.0.0",
    "database-service>=1.5.3,<2.0.0",
    "email-validator>=2.1.1,<3.0.0",
    "flask>=3.1.0,<4.0.0",
    "flask-caching>=2.3.0,<3.0.0",
    "flask-wtf>=1.2.1,<2.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "wtforms>=3.1.2,<4.0.0",
]

[project.urls]
Repository = "https://github.com/timonrieger/air-nomad-society"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ty>=0.0.55,<0.0.56",
]

[tool.uv]
# The app is run as scripts/entrypoints, not installed as a distribution. Phase 0
# turns this into a real package once the `src/` tree is restructured.
package = false
add-bounds = "major"

[tool.uv.sources]
database-service = { git = "https://github.com/timonrieger/database-service.git" }

[tool.ruff.lint.per-file-ignores]
# TODO(phase-0): `src/main.py` prepends the project root to `sys.path` before it
# imports, so its imports cannot sit at the top of the file. Packaging the
# project removes the hack, and this exemption with it.
"src/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.ty]
# TODO(phase-0): drop this exclusion module by module as the legacy tree is
# migrated to typed, testable functions. See docs/refactor-plan.md.
src.exclude = ["src/**"]
