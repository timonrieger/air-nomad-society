name: Weekly Digest

on:
  schedule:
    # Mondays 05:00 UTC. GitHub delays scheduled runs by up to ~15 minutes.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "dev sends only to the subscriber with id MY_UUID"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4

      - name: Run digest
        run: mise run digest
        env:
          DB_URI: ${{ secrets.DB_URI }}
          TEQUILA_API_KEY: ${{ secrets.TEQUILA_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PWD: ${{ secrets.SMTP_PWD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          # Scheduled runs have no inputs and fall back to prod; manual runs
          # default to dev so a dispatch can't accidentally email everyone.
          ENVIRONMENT: ${{ inputs.environment || 'prod' }}
          MY_UUID: ${{ secrets.MY_UUID }}
