[env]
_.python.venv = { path = ".venv" }

[deps.uv]
auto = true
run = "uv sync --all-groups ${CI:+--locked}"

[tasks.install]
run = "uv sync --all-groups ${CI:+--locked}"
description = "Install Python dependencies; asserts the lockfile with --locked under CI"

[tasks.install-upgrade]
run = "mise run '//packages/app:install' --upgrade"
description = "Upgrade Python dependencies in the allowed ranges"

[tasks.install-check]
run = "uv tree --outdated --all-groups --depth 1"
description = "Check Python dependencies for updates"

[tasks.test]
run = "uv run pytest"
description = "Run tests"

# Port 8000 on purpose: macOS AirPlay squats on 5000.
[tasks.dev]
run = "uv run uvicorn src.main:app --reload --port 8000"
description = "Run the API dev server"

[tasks.db-upgrade]
run = "uv run alembic upgrade head"
description = "Apply database migrations"

[tasks.db-revision]
run = "uv run alembic revision --autogenerate"
description = "Autogenerate a migration from model changes (append: -- -m 'message')"

[tasks.digest]
run = "uv run python -m src.cli digest"
description = "Run the flight digest job once against the configured database"

# In dev (ENVIRONMENT=dev + MY_UUID) the send is restricted to you — the
# test-send path before a production run.
[tasks.announce]
usage = '''
flag "-s --subject <subject>" required=#true help="The email's subject line"
flag "-b --body-file <file>" required=#true help="Plain-text body; blank lines separate paragraphs"
'''
run = 'uv run python -m src.cli announce "$usage_subject" "$usage_body_file"'
description = "Send a product update email to every confirmed subscriber"
