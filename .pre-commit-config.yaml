repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
      - id: check-json
        # tsconfig is JSONC (comments allowed), not strict JSON
        exclude: "tsconfig.json$"
      - id: end-of-file-fixer

  - repo: https://github.com/biomejs/pre-commit
    rev: 5090c1e080cc8cec15feee68a9355c0f660d3712  # frozen: v2.5.15
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.9"]
        files: ^packages/web/

  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        language: system
        entry: bash -c 'cd packages/web && pnpm exec svelte-kit sync && pnpm exec svelte-check --tsconfig ./tsconfig.json'
        files: ^packages/web/
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 2e145a365871c9fef3715d38b9b7393ce4174c85  # frozen: 0.13.0
    hooks:
      - id: uv-lock
        args: [--project, packages/app]
        files: ^packages/app/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        exclude: "^packages/app/tests"
        # B101: asserts as guards are the house style (see CLAUDE.md); the
        # app doesn't run under python -O.
        args: [--skip, B101]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013] # ignore line length

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: ded8634232ffc633dc66d44f1b0dfe2bdf766542  # frozen: v0.0.86
    hooks:
      - id: ty
        args: [--project, packages/app, --python, packages/app/.venv]
