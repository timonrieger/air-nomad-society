# Local development services. The app itself runs on the host (mise run dev);
# Phase 2 adds api/worker/scheduler containers on top of these.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ans
      POSTGRES_PASSWORD: ans
      POSTGRES_DB: ans
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
