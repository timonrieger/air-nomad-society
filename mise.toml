monorepo_root = true

[monorepo]
config_roots = ["packages/*"]

[settings]
experimental = true # required for [deps]

[tools]
pnpm = "11.22.0"
python = "3.14.6"
uv = "0.11.25"

[tasks.install]
depends = ["//packages/app:install", "//packages/web:install"]
alias = "i"
description = "Install dependencies for all packages (alias: 'i'); asserts the lockfiles under CI"

[tasks.setup]
run = ["mise run install", "uvx prek install"]
description = "Setup the project"

[tasks.lint]
depends = ["install"]
run = "uvx prek run --all-files"
description = "Run pre-commit hooks"
